name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff pyyaml jsonschema
      - run: ruff check --select E9,F63,F7,F82 --exclude engine/vendor .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pytest-cov pyyaml jsonschema requests
      - name: run tests
        run: |
          pytest tests --cov --cov-report=json -q
          python - << 'PY'
          import json, os
          cov = 0.0
          if os.path.exists('coverage.json'):
              cov = json.load(open('coverage.json'))['totals']['percent_covered']
          print(f"COVERAGE: {cov:.1f}")
          PY
  engine-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: build pinned Lua runtime
        run: engine/runtime/build.sh
      - name: run engine integration tests
        run: python3 -m unittest discover -s engine/tests -v
      - name: capture Linux runtime parity spot-check
        run: >-
          python3 -m engine.runtime_parity
          --output engine/runtime-parity-spot-check.json
      - name: upload Linux runtime parity spot-check
        uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-linux
          path: engine/runtime-parity-spot-check.json
          if-no-files-found: error
          retention-days: 7
  windows-worker-pipes:
    # TASK-209 / issue #75: Windows selectors reject anonymous subprocess
    # pipes. Exercise the real JsonRpcWorker ping/response path on Windows so
    # the shipping runtime cannot regress to WinError 10038.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pyyaml jsonschema
      - name: exercise worker subprocess pipes
        run: >-
          python -m pytest
          tests/test_server.py::test_worker_reads_subprocess_pipes_without_selector_support
          -q
  windows-runtime-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pyyaml
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: build and smoke-test pinned Windows x86-64 Lua runtime
        shell: pwsh
        run: ./engine/runtime/build-windows.ps1
      - name: exercise run.bat Windows runtime path
        shell: cmd
        run: |
          copy /Y packaging\run.bat run.bat
          call run.bat --runtime-check-only
      - name: capture Windows runtime parity spot-check
        run: >-
          python -m engine.runtime_parity
          --output engine/runtime-parity-spot-check.json
      - name: upload Windows runtime parity spot-check
        uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-windows
          path: engine/runtime-parity-spot-check.json
          if-no-files-found: error
          retention-days: 7
      - name: upload pinned Windows x86-64 Lua runtime
        uses: actions/upload-artifact@v4
        with:
          name: pobcalc-runtime-windows-x64-luajit-a471ab78c7b670b4f92dae111fc3c96fb824c768-luautf8-08b0fc930f5a52eff36348ed1ea39aadfc697fa6
          path: engine/.runtime
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  runtime-parity-cross-platform:
    needs: [engine-integration, windows-runtime-build]
    runs-on: ubuntu-latest
    steps:
      - name: download Linux runtime parity spot-check
        uses: actions/download-artifact@v4
        with:
          name: runtime-parity-linux
          path: runtime-parity/linux
      - name: download Windows runtime parity spot-check
        uses: actions/download-artifact@v4
        with:
          name: runtime-parity-windows
          path: runtime-parity/windows
      - name: require byte-identical runtime outputs
        run: >-
          cmp
          runtime-parity/linux/runtime-parity-spot-check.json
          runtime-parity/windows/runtime-parity-spot-check.json
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openapi-spec-validator jsonschema pyyaml
      - run: |
          python -c "from openapi_spec_validator import validate; import yaml; validate(yaml.safe_load(open('contracts/openapi.yaml')))"
          python -c "import json, jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('contracts/verdict.schema.json')))"
          python -c "import json, jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('agents/postmaster/message_schema.json')))"
  doctrine-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml jsonschema
      - run: python scripts/check_invariants.py
  assumptions-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml pytest
      - run: python scripts/check_fixture_coverage.py
