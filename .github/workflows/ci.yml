name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff pyyaml jsonschema
      - run: ruff check --select E9,F63,F7,F82 --exclude engine/vendor .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pytest-cov pyyaml jsonschema requests
      - name: run tests
        run: pytest tests packaging -q
  coverage-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pytest-cov pyyaml jsonschema requests
      - run: pytest tests --cov --cov-report=json -q
      - run: python3 scripts/check_coverage_floor.py
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --prefix web
      - run: npm --prefix web run test
      - run: npm --prefix web run build
  overlay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: overlay/package-lock.json }
      - run: npm ci --prefix overlay
      - run: npm --prefix overlay run test
      - run: npm --prefix overlay run build
  packet-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema pyyaml
      - run: python3 agents/packets/validate.py --all
  engine-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # jsonschema is needed by engine/tests/test_server_adapter.py, which
      # validates verdict payloads against contracts/verdict.schema.json.
      # `unittest discover` imports every test module before running any, so a
      # missing dep here is a COLLECTION error that fails the whole job, not
      # one test. Landed red in 69a1f6a; see TASK-213 / issue #123.
      - run: pip install pyyaml jsonschema
      - name: build pinned Lua runtime
        run: engine/runtime/build.sh
      - name: run engine integration tests
        run: python3 -m unittest discover -s engine/tests -v
      - name: run strict corpus parity
        run: engine/corpus/run_corpus.sh
      - name: capture Linux runtime parity spot-check
        run: >-
          python3 -m engine.runtime_parity
          --output engine/runtime-parity-spot-check.json
      - name: upload Linux runtime parity spot-check
        uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-linux
          path: engine/runtime-parity-spot-check.json
          if-no-files-found: error
          retention-days: 7

  windows-package-cleanroom:
    # TASK-209 lane C (issue #75): build the tester-facing Windows zip and
    # clean-room it on a real Windows machine. Lane A's pinned runtime
    # artifact is downloaded CROSS-RUN (by exact pinned name, MAIN-branch
    # runs only — "when it lands" means merged; pre-merge PR artifacts are
    # ignored) instead of via `needs:` so this workflow stays valid before
    # lane A merges. Until the artifact lands on main, the zip ships the
    # explicit stub runtime and the clean-room asserts the honest 'engine
    # cannot start' failure (I5) — a hard assertion, never a silent skip.
    # SEQUENCING: once lane A merges, real-mode assertions activate; lane B
    # (Windows worker entrypoint) must merge with or before lane A, or this
    # job goes red by design — the honest alarm that the slice is incomplete.
    runs-on: windows-latest
    permissions:
      actions: read  # cross-run artifact download (lane A runtime)
      # contents: write is required by the release step below — `gh release
      # create` 403s on read. Scoped to THIS job only; every other job in this
      # workflow keeps the default read-only token.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: locate lane A pinned Windows runtime artifact
        id: rt
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $name = "pobcalc-runtime-windows-x64-luajit-a471ab78c7b670b4f92dae111fc3c96fb824c768-luautf8-08b0fc930f5a52eff36348ed1ea39aadfc697fa6"
          $resp = gh api "repos/${{ github.repository }}/actions/artifacts?name=$name&per_page=20" | ConvertFrom-Json
          $artifact = $resp.artifacts |
            Where-Object { -not $_.expired -and $_.workflow_run.head_branch -eq "main" } |
            Sort-Object created_at -Descending | Select-Object -First 1
          if ($null -ne $artifact) {
            Write-Host "== lane A runtime artifact #$($artifact.id) (run $($artifact.workflow_run.id), $($artifact.created_at))"
            "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "run_id=$($artifact.workflow_run.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "::warning::lane A runtime artifact has not landed on main yet — zip gets the explicit stub runtime; clean-room asserts the honest failure (I5)"
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: download lane A pinned Windows runtime
        if: steps.rt.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pobcalc-runtime-windows-x64-luajit-a471ab78c7b670b4f92dae111fc3c96fb824c768-luautf8-08b0fc930f5a52eff36348ed1ea39aadfc697fa6
          run-id: ${{ steps.rt.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: engine/.runtime
      # TASK-215-S3 (orchestrator, .github is PROTECTED so no role can do this):
      # build the overlay so the zip a player downloads actually contains it.
      # Without these two steps the packager runs with no -OverlayDir, stages
      # OVERLAY-STUB.txt, and CI proves nothing about the mission's headline
      # capability while looking entirely green.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build the Windows overlay app
        shell: pwsh
        run: |
          npm ci --prefix overlay --no-audit --no-fund
          npm --prefix overlay run package:win
      - name: package Windows zip
        shell: pwsh
        run: |
          $overlay = "overlay/dist-win/PoEUpgradeAdvisorOverlay-win32-x64"
          if ("${{ steps.rt.outputs.found }}" -eq "true") {
            ./scripts/package_mvp_windows.ps1 -RuntimeDir engine/.runtime -OverlayDir $overlay
          } else {
            ./scripts/package_mvp_windows.ps1 -OverlayDir $overlay
          }
      - name: clean-room check (fresh extract, run.bat, POST /build golden code)
        shell: pwsh
        run: |
          if ("${{ steps.rt.outputs.found }}" -eq "true") {
            ./scripts/cleanroom_windows_check.ps1 -ExpectRealOverlay
          } else {
            ./scripts/cleanroom_windows_check.ps1 -ExpectStubRuntime -ExpectRealOverlay
          }
      - name: upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: poe-upgrade-advisor-v0-${{ github.sha }}-windows-x64
          path: dist/poe-upgrade-advisor-v0-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
      # TASK-304-S1 part two (orchestrator; .github is PROTECTED, so no role
      # can do this). Publish the zip as a real Release from the SAME commit,
      # so the asset a player downloads and the build the bot announces are one
      # thing: the announcer gates on release_sha_is_green() for this SHA, and
      # this step only runs once that SHA's Windows clean-room has passed.
      #
      # Why automation rather than a human errand: v0.1.0 sat as `latest` for a
      # week as a Linux bundle with NO overlay while the channel said the
      # overlay had shipped, and the artifact behind the manual path EXPIRES
      # after the 7-day retention above. A hand-cut release goes stale
      # silently, and /download resolves releases/latest.
      #
      # main pushes only — a PR must never publish. continue-on-error because a
      # publish failure must not turn the clean-room job red: the zip is
      # already uploaded above and the BUILD is still proven either way.
      - name: publish the Windows build as a Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem dist/poe-upgrade-advisor-v0-*-windows-x64.zip | Select-Object -First 1
          if ($null -eq $zip) { throw "no Windows zip to publish" }
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          $lines = @(
            "**Windows x86-64. The in-game overlay is included.**",
            "",
            "Extract anywhere and run run.bat - it starts the local server, the web page and the overlay together. Press Ctrl+Alt+D to show the overlay; set OVERLAY_HOTKEY to change it, or use 'run.bat --no-overlay' for the web page alone.",
            "",
            "Requires Windows x64 and Python 3.10+. Everything binds to 127.0.0.1; nothing is sent anywhere.",
            "",
            ("Built from " + $sha + " with the Windows clean-room check asserting overlay/PoEUpgradeAdvisorOverlay.exe is present in the extracted archive.")
          )
          Set-Content -LiteralPath notes.md -Value $lines -Encoding utf8
          gh release create "build-$short" $zip.FullName --title "Windows build $short" --notes-file notes.md --target $sha 2>&1 | Write-Host
  windows-worker-pipes:
    # TASK-209 / issue #75: Windows selectors reject anonymous subprocess
    # pipes. Exercise the real JsonRpcWorker ping/response path on Windows so
    # the shipping runtime cannot regress to WinError 10038.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pyyaml jsonschema
      - name: exercise worker subprocess pipes
        run: >-
          python -m pytest
          tests/test_server.py::test_worker_reads_subprocess_pipes_without_selector_support
          -q
  windows-runtime-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pyyaml
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: build and smoke-test pinned Windows x86-64 Lua runtime
        shell: pwsh
        run: ./engine/runtime/build-windows.ps1
      - name: exercise run.bat Windows runtime path
        shell: cmd
        run: |
          copy /Y packaging\run.bat run.bat
          call run.bat --runtime-check-only
      - name: capture Windows runtime parity spot-check
        run: >-
          python -m engine.runtime_parity
          --output engine/runtime-parity-spot-check.json
      - name: upload Windows runtime parity spot-check
        uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-windows
          path: engine/runtime-parity-spot-check.json
          if-no-files-found: error
          retention-days: 7
      - name: upload pinned Windows x86-64 Lua runtime
        uses: actions/upload-artifact@v4
        with:
          name: pobcalc-runtime-windows-x64-luajit-a471ab78c7b670b4f92dae111fc3c96fb824c768-luautf8-08b0fc930f5a52eff36348ed1ea39aadfc697fa6
          path: engine/.runtime
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  runtime-parity-cross-platform:
    needs: [engine-integration, windows-runtime-build]
    runs-on: ubuntu-latest
    steps:
      - name: download Linux runtime parity spot-check
        uses: actions/download-artifact@v4
        with:
          name: runtime-parity-linux
          path: runtime-parity/linux
      - name: download Windows runtime parity spot-check
        uses: actions/download-artifact@v4
        with:
          name: runtime-parity-windows
          path: runtime-parity/windows
      - name: require byte-identical runtime outputs
        run: >-
          cmp
          runtime-parity/linux/runtime-parity-spot-check.json
          runtime-parity/windows/runtime-parity-spot-check.json
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openapi-spec-validator jsonschema pyyaml
      - run: |
          python -c "from openapi_spec_validator import validate; import yaml; validate(yaml.safe_load(open('contracts/openapi.yaml')))"
          python -c "import json, jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('contracts/verdict.schema.json')))"
          python -c "import json, jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('agents/postmaster/message_schema.json')))"
  doctrine-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml jsonschema
      - run: python scripts/check_invariants.py
  assumptions-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml pytest
      - run: python scripts/check_fixture_coverage.py
