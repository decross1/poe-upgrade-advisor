# The spend firewall. Edit caps here; nothing else in the org limits spend.
per_task_max_invocations: 12       # lifetime invocations per TASK-id per role
per_day_max:
  pm: 24
  backend: 36
  frontend: 36
backoff:
  base_minutes: 10                 # after a failed invocation: base * 2^(consecutive_failures-1)
  max_minutes: 480
circuit_breaker_consecutive_failures: 3   # trips task->dead_letter + needs-redesign
daily_reset_hour_utc: 4

# Per-tier execution budgets (Lane A key; dispatch.py resolves these via
# agents/interfaces/policy.py::resolve_budgets — packet overrides may only
# tighten). max_attempts is the per-MESSAGE dispatcher cap, the binding
# control from the 2026-07-27 incident: it bounds an agent that never
# returns a result, which per-task caps cannot. Values adopted as written
# from the reviewed Phase 6 defaults; org gets green-like caps — no
# unlimited exemption survives.
execution_classes:
  green:
    max_attempts: 2
    max_files_inspected: 8
    max_files_modified: 3
    max_diff_lines: 150
    max_tool_calls: 18
    max_test_runs: 3
    max_wall_clock_seconds: 1200
    consecutive_no_progress: 1
  yellow:
    max_attempts: 3
    max_files_inspected: 15
    max_files_modified: 6
    max_diff_lines: 400
    max_tool_calls: 35
    max_test_runs: 5
    max_wall_clock_seconds: 2700
    consecutive_no_progress: 2
  red:
    max_attempts: 2
    max_files_inspected: 25
    max_files_modified: 10
    max_diff_lines: 700
    max_tool_calls: 50
    max_test_runs: 6
    max_wall_clock_seconds: 3600
    consecutive_no_progress: 1
  org:
    max_attempts: 2
    max_files_inspected: 8
    max_files_modified: 3
    max_diff_lines: 150
    max_tool_calls: 18
    max_test_runs: 3
    max_wall_clock_seconds: 1200
    consecutive_no_progress: 1
