# Aggregate execution policy — Lane B key space.
#
# Split from policy.yaml so two concurrent dev lanes never edit the same YAML.
# agents/interfaces/policy.py::load_policy merges both files and RAISES if a
# top-level key appears in both, so a boundary violation is a test failure
# rather than a silent overwrite.
#
# Lane A owns policy.yaml: per_task_max_invocations, backoff,
# circuit_breaker_consecutive_failures, execution_classes, circuit_breakers,
# recovery, progress.
#
# per_day_max and daily_reset_hour_utc moved here from policy.yaml by pm in a
# single atomic commit: budget_governor.py does p["per_day_max"][role] with no
# guard, so a window where neither file defines it would KeyError on every
# governor call.
#
# EVERY NUMERIC CAP BELOW IS [E]: a placeholder derived from a three-day run
# under different roles/models and before these controls existed. Replace the
# numbers from measured shakedown telemetry before unattended operation.

per_day_max:
  # 2026-08-04 [O]perator ruling, superseding the 24 -> 48 doubling below:
  # "don't put artificial caps on things like the number of invocations —
  # just increase this number if we have not hit the session limits."
  #
  # The point of the run is to measure what THIS subscription level actually
  # delivers on a discrete objective. A self-imposed daily cap corrupts that
  # measurement: it makes the org look slower than the subscription is, and
  # every hour it idles below the provider ceiling is a lost data point, not
  # a saved resource. The PROVIDER's own refusal is the exhaustion signal
  # (L-14), and it is the only one that measures anything real.
  #
  # Evidence this cap was pure loss: pm hit 48 at ~20:30Z with claude at 62%
  # of weekly remaining, then idled ~7.5h. Earlier the same day it hit 24 and
  # cost the org an eight-hour stall while a funded frontend sat empty. Both
  # stalls were self-inflicted; neither provider ever refused.
  #
  # These numbers are deliberately far above any plausible day so the cap
  # stops binding, WITHOUT removing the key — budget_governor does
  # p["per_day_max"][role] with no guard, so deleting a role KeyErrors every
  # governor call. Runaway protection does not live here anyway: it is the
  # per-message attempt cap, the circuit breaker, the anti-loop controller,
  # and the provider-limit gate.
  pm: 500
  backend: 500
  # frontend runs on kimi, the ONE metered budget, and L-29 means its spend is
  # currently unmeasurable (every cash_usd row is null). Raised well clear of
  # binding, but kept lower than the subscription roles as a crude backstop
  # until spend is actually observable. The Kimi console remains the real
  # ceiling.
  frontend: 300
daily_reset_hour_utc: 4

roles:
  pm: {budget: claude, allowance_owner: pm}
  backend: {budget: codex, allowance_owner: backend}
  # 2026-08-03 operator ruling: frontend reinstated on kimi (metered).
  frontend: {budget: kimi, allowance_owner: frontend}

run:
  id: unattended-2026-08
  target_days: 10
  min_acceptable_days: 7
  allowance_stale_hours: 30
  budgets:
    frontier_cash:
      total_usd: 50.00
      per_day_usd: 4.20
      per_task_usd: 0.25
    claude:
      pct_weekly_per_day: 9.0
      pct_weekly_total: 95.0
      per_task_pct: 1.5
    codex:
      pct_weekly_per_day: 11.0
      pct_weekly_total: 120.0
      per_task_pct: 2.0
    # 2026-08-03 [O]perator-set: the $50 autonomy-test wall for kimi-backed
    # frontend work (operator holds ~$100 credits, capped org-side at 50).
    # Sub-caps are pm-tuned: per-day 10 keeps ~5 days of runway, per-task
    # 1.50 is generous for kimi pricing. Enforced tier-independent by
    # run_budget.check's kimi branch; Kimi-console limit is the backstop.
    kimi:
      total_usd: 50.00
      per_day_usd: 10.00
      per_task_usd: 1.50
  reserve:
    cash_usd: 8.00
    unlock_after_day: 8
    unlock_also_if: ["main_red_over_6h", "dead_letter_count > 4"]
  carry_forward_days: 2
  on_daily_cap: throttle_role
  on_total_cap: disable_role
  on_role_disabled:
    frontend: {reassign_to: backend}
    pm: {promote: backend}

degradation:
  levels: 7
  allowance_stale_hours: 30
  dead_letters_elevated: 5
  main_red_revert_hours: 6
  reserve_unlock_red_hours: 12
  halt_red_hours: 24
