# Aggregate execution policy — Lane B key space.
#
# Split from policy.yaml so two concurrent dev lanes never edit the same YAML.
# agents/interfaces/policy.py::load_policy merges both files and RAISES if a
# top-level key appears in both, so a boundary violation is a test failure
# rather than a silent overwrite.
#
# Lane A owns policy.yaml: per_task_max_invocations, backoff,
# circuit_breaker_consecutive_failures, execution_classes, circuit_breakers,
# recovery, progress.
#
# per_day_max and daily_reset_hour_utc moved here from policy.yaml by pm in a
# single atomic commit: budget_governor.py does p["per_day_max"][role] with no
# guard, so a window where neither file defines it would KeyError on every
# governor call.
#
# EVERY NUMERIC CAP BELOW IS [E]: a placeholder derived from a three-day run
# under different roles/models and before these controls existed. Replace the
# numbers from measured shakedown telemetry before unattended operation.

per_day_max:
  # 2026-08-03 [O]perator ruling: double pm's daily cap for this session.
  # Measured basis, not a guess: pm reached 27 invocations by 07:07Z with only
  # 7 successes, and the overrun mattered far more than pm's own throughput —
  # pm is the org's ROUTER, so its cap is the binding constraint on the WHOLE
  # org. When it hit, four mission messages (TASK-210-S2/S3/S4, TASK-009) sat
  # retained on "daily cap" for eight hours while a healthy, funded frontend
  # role idled with an empty queue. 24 was always [E] — a placeholder from a
  # three-day run under different roles. 48 is [O]perator-set for today and
  # still bounded; revisit from shakedown telemetry rather than keeping it.
  pm: 48
  backend: 36
  frontend: 36
daily_reset_hour_utc: 4

roles:
  pm: {budget: claude, allowance_owner: pm}
  backend: {budget: codex, allowance_owner: backend}
  # 2026-08-03 operator ruling: frontend reinstated on kimi (metered).
  frontend: {budget: kimi, allowance_owner: frontend}

run:
  id: unattended-2026-08
  target_days: 10
  min_acceptable_days: 7
  allowance_stale_hours: 30
  budgets:
    frontier_cash:
      total_usd: 50.00
      per_day_usd: 4.20
      per_task_usd: 0.25
    claude:
      pct_weekly_per_day: 9.0
      pct_weekly_total: 95.0
      per_task_pct: 1.5
    codex:
      pct_weekly_per_day: 11.0
      pct_weekly_total: 120.0
      per_task_pct: 2.0
    # 2026-08-03 [O]perator-set: the $50 autonomy-test wall for kimi-backed
    # frontend work (operator holds ~$100 credits, capped org-side at 50).
    # Sub-caps are pm-tuned: per-day 10 keeps ~5 days of runway, per-task
    # 1.50 is generous for kimi pricing. Enforced tier-independent by
    # run_budget.check's kimi branch; Kimi-console limit is the backstop.
    kimi:
      total_usd: 50.00
      per_day_usd: 10.00
      per_task_usd: 1.50
  reserve:
    cash_usd: 8.00
    unlock_after_day: 8
    unlock_also_if: ["main_red_over_6h", "dead_letter_count > 4"]
  carry_forward_days: 2
  on_daily_cap: throttle_role
  on_total_cap: disable_role
  on_role_disabled:
    frontend: {reassign_to: backend}
    pm: {promote: backend}

degradation:
  levels: 7
  allowance_stale_hours: 30
  dead_letters_elevated: 5
  main_red_revert_hours: 6
  reserve_unlock_red_hours: 12
  halt_red_hours: 24
