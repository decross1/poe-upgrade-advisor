# Completion-proof contract (CC-2) — RATIFIED proofs #1-#15 (pm ANSWER
# 2026-08-02T20:50Z, from the v1.0 reconstruction). Data, not code: the
# active list and parameters live here; checkers are registered in
# agents/completion.py. Numbering anchors #3/#4/#8 are fixed by v1.1 —
# do not renumber.
schema_version: "2.0"

# Repo-wide default task-branch pattern (proof #4). A packet's own
# `branch_pattern` field overrides it when that schema field lands
# (protected change, Lane B).
#
# L-10 (2026-08-03, observed live). The original value was the A5
# reconstruction's `^(task|canary|repair)/TASK-[0-9]+...$`, which
# CONTRADICTS AGENTS.md:18 — doctrine, and itself a PROTECTED file — whose
# rule is `role/<task-id>-<slug>`. The reconstruction audit flagged the
# contradiction in writing ("matches none of the three live PR branches");
# it was ratified around, and it then refused pm's mission run for branch
# `pm/ORG-canary-verdict`. Two consequences it made structural:
#   * a role branch (`pm/...`, `backend/...`, `frontend/...`) could never
#     pass, though AGENTS.md mandates exactly that shape; and
#   * ORG work could never pass at all, since task_id "ORG" is not
#     TASK-<digits> — so every governance task was unprovable.
# Doctrine wins over a reconstructed regex. Both forms are now accepted:
# AGENTS.md's `role/<task-id>-<slug>` and the canary/repair prefixes the
# ratified packet uses. `main` and empty still fail (T-A4).
# Case-insensitive on the task token only: `backend/task-404-...` (PR #30,
# live) differs from `backend/TASK-404-...` cosmetically, not structurally,
# and the proof exists to establish "pushed to a task branch, not main or
# something arbitrary". Casing does not bear on that.
branch_pattern: "^((pm|backend|frontend)/([Oo][Rr][Gg]|[Tt][Aa][Ss][Kk]-[0-9]+(-[Ss][0-9]+)?)[a-zA-Z0-9._-]*|(task|canary|repair)/[Tt][Aa][Ss][Kk]-[0-9]+(-[Ss][0-9]+)?[a-zA-Z0-9._-]*)$"

proofs:
  - id: result_valid            # 1
  - id: completed_fields        # 2
  - id: pushed                  # 3  (anchor)
  - id: branch_pattern          # 4  (anchor)
  - id: commit_exists           # 5
  - id: descends_from_base      # 6
  - id: tree_clean_after_sweep  # 7
  - id: remote_agreement        # 8  (anchor; persists ls-remote evidence)
  - id: required_checks_pass    # 9  (CC-1 results, dispatcher-run)
  - id: acceptance_criteria     # 10
  - id: scope                   # 11
  - id: protected_paths         # 12 (circuit break)
  - id: banned_patterns         # 13 (circuit break)
  - id: budgets                 # 14 (ceiling per A4; known-over breaks)
  - id: accounting_before_ack   # 15 (dispatcher-evaluated at ack time)
